<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" width="820" height="320" font-family="'Noto Sans Thai','Sarabun',sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
    <marker id="arr-freeze" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1e3a8a"/>
    </marker>
    <marker id="arr-lora" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#059669"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
  </defs>

  <!-- === INPUT === -->
  <circle cx="60" cy="160" r="32" fill="#1e3a8a" filter="url(#shadow)"/>
  <text x="60" y="155" text-anchor="middle" fill="white" font-size="22" font-weight="700" font-style="italic">x</text>
  <text x="60" y="175" text-anchor="middle" fill="#93c5fd" font-size="13">input</text>

  <!-- Arrow from input to fork -->
  <line x1="93" y1="160" x2="148" y2="160" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- === FORK POINT === -->
  <circle cx="158" cy="160" r="6" fill="#64748b"/>

  <!-- === TOP PATH: FROZEN W === -->
  <line x1="158" y1="154" x2="158" y2="82" stroke="#1e3a8a" stroke-width="2.5" stroke-dasharray="5,3"/>
  <line x1="158" y1="80" x2="296" y2="80" stroke="#1e3a8a" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arr-freeze)"/>
  <!-- W box -->
  <rect x="298" y="42" width="220" height="76" rx="12" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="375" y="88" text-anchor="middle" fill="#1e3a8a" font-size="26" font-weight="700">🔒 W</text>
  <text x="408" y="108" text-anchor="middle" fill="#2563eb" font-size="13">Frozen — ไม่อัปเดต</text>
  <!-- Arrow out of W -->
  <line x1="518" y1="80" x2="658" y2="80" stroke="#1e3a8a" stroke-width="2.5" stroke-dasharray="5,3"/>
  <line x1="660" y1="80" x2="660" y2="134" stroke="#1e3a8a" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arr-freeze)"/>

  <!-- === BOTTOM PATH: LoRA A → B === -->
  <line x1="158" y1="166" x2="158" y2="238" stroke="#059669" stroke-width="2.5"/>
  <line x1="158" y1="240" x2="296" y2="240" stroke="#059669" stroke-width="2.5" marker-end="url(#arr-lora)"/>

  <!-- A box -->
  <rect x="298" y="202" width="116" height="76" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="356" y="242" text-anchor="middle" fill="#065f46" font-size="26" font-weight="700">A</text>
  <text x="356" y="264" text-anchor="middle" fill="#059669" font-size="13">r × k (trainable)</text>

  <!-- Arrow A → B -->
  <line x1="414" y1="240" x2="498" y2="240" stroke="#059669" stroke-width="2.5" marker-end="url(#arr-lora)"/>

  <!-- B box -->
  <rect x="500" y="202" width="116" height="76" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="558" y="242" text-anchor="middle" fill="#065f46" font-size="26" font-weight="700">B</text>
  <text x="558" y="264" text-anchor="middle" fill="#059669" font-size="13">d × r (trainable)</text>

  <!-- scale label -->
  <text x="558" y="194" text-anchor="middle" fill="#065f46" font-size="14" font-style="italic">× α/r</text>

  <!-- Arrow out of B -->
  <line x1="616" y1="240" x2="660" y2="240" stroke="#059669" stroke-width="2.5"/>
  <line x1="660" y1="240" x2="660" y2="186" stroke="#059669" stroke-width="2.5" marker-end="url(#arr-lora)"/>

  <!-- === SUM NODE === -->
  <circle cx="660" cy="160" r="24" fill="white" stroke="#f59e0b" stroke-width="3" filter="url(#shadow)"/>
  <text x="660" y="168" text-anchor="middle" fill="#f59e0b" font-size="28" font-weight="700">+</text>

  <!-- Arrow to output -->
  <line x1="684" y1="160" x2="748" y2="160" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- === OUTPUT === -->
  <circle cx="762" cy="160" r="32" fill="#1e3a8a" filter="url(#shadow)"/>
  <text x="762" y="155" text-anchor="middle" fill="white" font-size="22" font-weight="700" font-style="italic">h</text>
  <text x="762" y="175" text-anchor="middle" fill="#93c5fd" font-size="13">output</text>

  <!-- === Formula === -->
  <text x="410" y="308" text-anchor="middle" fill="#475569" font-size="15" font-style="italic">W&#x2019; = W + (&#x3b1;/r) &#x00b7; BA</text>

  <!-- === Legend === -->
  <line x1="10" y1="296" x2="28" y2="296" stroke="#1e3a8a" stroke-width="3" stroke-dasharray="5,3"/>
  <text x="34" y="301" fill="#64748b" font-size="13">Frozen weights</text>
  <line x1="150" y1="296" x2="168" y2="296" stroke="#059669" stroke-width="3"/>
  <text x="174" y="301" fill="#64748b" font-size="13">Trainable (LoRA)</text>
</svg>
